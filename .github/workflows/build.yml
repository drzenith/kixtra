# One lean job: build the APK and publish it as the rolling "latest" release.
# Signed with the key stored in the KIXTRA_KEYSTORE_B64 / KIXTRA_KEYSTORE_PASSWORD repo secrets.
name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KIXTRA_KEYSTORE_B64 }}
          KIXTRA_KEYSTORE_PASSWORD: ${{ secrets.KIXTRA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KIXTRA_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing KIXTRA_KEYSTORE_B64 / KIXTRA_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi
          export KIXTRA_KEYSTORE_PATH="$RUNNER_TEMP/kixtra-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KIXTRA_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease --stacktrace

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk kixtra.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest kixtra.apk \
            --title "Kixtra build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Install kixtra.apk on your phone." \
            --prerelease --target "$GITHUB_SHA"
